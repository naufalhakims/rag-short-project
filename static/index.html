<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pocket Librarian</title>
    <meta name="description" content="Ask questions about your own documents and get answers that cite their sources." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ea580c'/%3E%3Cpath d='M16 9.5v14m0-14C14.6 8.6 12.7 8 10.5 8S6.4 8.6 5 9.5v14c1.4-.9 3.3-1.5 5.5-1.5s4.1.6 5.5 1.5m0-14c1.4-.9 3.3-1.5 5.5-1.5s4.1.6 5.5 1.5v14c-1.4-.9-3.3-1.5-5.5-1.5s-4.1.6-5.5 1.5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" hidden>
        <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.25v13m0-13C10.83 5.48 9.25 5 7.5 5S4.17 5.48 3 6.25v13C4.17 18.48 5.75 18 7.5 18s3.33.48 4.5 1.25m0-13C13.17 5.48 14.75 5 16.5 5s3.33.48 4.5 1.25v13C19.83 18.48 18.25 18 16.5 18s-3.33.48-4.5 1.25"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 18 18 6M6 6l12 12"/></symbol>
        <symbol id="i-chat" viewBox="0 0 24 24"><path d="M8 10h8M8 14h5m-9 6 2.2-4.8A8 8 0 1 1 12 20H4Z"/></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7l-4-4Zm0 0v4h4M9 13h6m-6 4h4"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="m19 7-.86 12.14A2 2 0 0 1 16.15 21h-8.3a2 2 0 0 1-1.99-1.86L5 7m5 4v6m4-6v6M4 7h16m-5 0V4H9v3"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0 4 4m-4-4L8 8M4 16.5V19a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2.5"/></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></symbol>
        <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 9h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1Zm-4 6H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></symbol>
        <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4 4v5h5M20 20v-5h-5M5.6 15A7 7 0 0 0 18 16.5M18.4 9A7 7 0 0 0 6 7.5"/></symbol>
    </svg>

    <div class="app">
        <div id="backdrop" class="backdrop" hidden></div>

        <aside id="sidebar" class="sidebar" aria-label="Library and conversations">
            <div class="brand">
                <span class="brand-mark"><svg class="icon"><use href="#i-book"/></svg></span>
                <div class="brand-text">
                    <strong>Pocket Librarian</strong>
                    <span>Answers from your documents</span>
                </div>
                <button class="icon-btn only-mobile" data-action="close-sidebar" aria-label="Close sidebar">
                    <svg class="icon"><use href="#i-close"/></svg>
                </button>
            </div>

            <button class="btn btn-primary new-chat" data-action="new-chat">
                <svg class="icon"><use href="#i-plus"/></svg> New chat
            </button>

            <div class="sidebar-scroll">
                <section>
                    <h2 class="section-title">Conversations</h2>
                    <ul id="session-list" class="list"></ul>
                </section>
                <section>
                    <h2 class="section-title">This chat's documents</h2>
                    <ul id="document-list" class="list"></ul>
                    <button id="picker-toggle" class="link-btn picker-toggle" type="button" aria-expanded="false" hidden></button>
                    <ul id="picker-list" class="list picker" hidden></ul>
                </section>
            </div>

            <div class="upload">
                <label id="drop-zone" class="drop-zone" tabindex="0">
                    <input id="file-input" type="file" multiple hidden />
                    <svg class="icon"><use href="#i-upload"/></svg>
                    <span>
                        <strong>Upload to this chat</strong>
                        <small id="upload-hint">PDF, Word, Markdown or text</small>
                    </span>
                </label>
                <ul id="upload-status" class="upload-status" aria-live="polite"></ul>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <button class="icon-btn only-mobile" data-action="open-sidebar" aria-label="Open sidebar">
                    <svg class="icon"><use href="#i-menu"/></svg>
                </button>
                <h1 id="chat-title" class="chat-title">New chat</h1>
                <div id="model-pill" class="pill" title="Checking the language model…">
                    <span class="dot"></span><span id="model-label">Connecting…</span>
                </div>
            </header>

            <div id="notice" class="notice" role="status" hidden></div>

            <div id="messages" class="messages" aria-live="polite">
                <div id="thread" class="thread"></div>
            </div>

            <form id="composer" class="composer" autocomplete="off">
                <div class="composer-box">
                    <textarea id="question" rows="1" placeholder="Ask about your documents…" aria-label="Your question" maxlength="4000"></textarea>
                    <button id="send" class="send" type="submit" aria-label="Send">
                        <svg class="icon"><use id="send-icon" href="#i-send"/></svg>
                    </button>
                </div>
                <p class="fine-print">Answers are generated from your documents and cite their sources. Check anything important against the original.</p>
            </form>
        </main>
    </div>

    <script src="/static/vendor/marked.min.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
