[project]
name = "pocket-librarian"
version = "2.0.0"
description = "Local RAG app: ask questions about your own documents, with cited answers."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI declares dependencies as argument defaults

[tool.ruff.lint.per-file-ignores]
"app/rag/prompts.py" = ["E501"]  # prompt text reads better unwrapped
"tests/*" = ["E501"]
